name: ci

# The 22 Oct 2026 run never started a runner. GitHub's annotation was:
# "The job was not started because your account is locked due to a billing issue."
# This workflow runs the offline tests and the TypeScript build. It does not call DeepSeek.
# ubuntu-22.04 is pinned because ubuntu-latest is moving to Ubuntu 26.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
